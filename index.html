            preloadGalleryImages();
            // 预加载Stage 8的3D照片心形（避免切换时卡顿）
            setTimeout(() => preloadPhotoHeart(), 1000);
        }

        // ==================== Stage 8: 3D照片心形功能 ====================

        // 获取心形路径上的点 - 更大更明显的爱心形状
        function getPhotoHeartPoints(count) {
            const points = [];
            const scale = 1.2; // 放大心形
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                // 标准心形参数方程
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                // 给一点Z轴深度，但不要太多以保持心形可辨认
                const z = (Math.random() - 0.5) * 2;
                const vec = new THREE.Vector3(x * scale, y * scale, z);
                points.push(vec);
            }
            return points;
        }

        // 创建加载中的占位纹理
        function createPhotoPlaceholder(index) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#666';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Loading...', 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        // 预加载照片心形（在init阶段调用，避免卡顿）
        function preloadPhotoHeart() {
            if (photoHeartGroup) return;

            photoHeartGroup = new THREE.Group();
            photoHeartGroup.visible = false;
            scene.add(photoHeartGroup);

            // 照片几何体 - 较大的照片尺寸，便于看清内容
            const photoSize = 3.5;
            const geometry = new THREE.PlaneGeometry(photoSize, photoSize);

            // 白色细边框
            const frameGeo = new THREE.PlaneGeometry(photoSize + 0.2, photoSize + 0.2);
            const frameMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide
            });

            const heartPoints = getPhotoHeartPoints(PHOTO_HEART_CONFIG.photoCount);
            const loader = new THREE.TextureLoader();

            for (let i = 0; i < PHOTO_HEART_CONFIG.photoCount; i++) {
                const group = new THREE.Group();

                // 照片材质 - MeshBasicMaterial不受光照影响，显示原色
                const photoMat = new THREE.MeshBasicMaterial({
                    map: createPhotoPlaceholder(i),
                    side: THREE.DoubleSide
                });

                // 异步加载真实图片，并根据图片比例调整几何体
                loader.load(PHOTO_HEART_CONFIG.photoUrls[i], (texture) => {
                    // 保持原图颜色
                    texture.colorSpace = THREE.SRGBColorSpace;
                    photoMat.map = texture;
                    photoMat.needsUpdate = true;

                    // 根据图片实际比例调整几何体
                    const img = texture.image;
                    if (img && img.width && img.height) {
                        const aspectRatio = img.width / img.height;
                        let newWidth, newHeight;
                        if (aspectRatio > 1) {
                            // 横向照片
                            newWidth = photoSize;
                            newHeight = photoSize / aspectRatio;
                        } else {
                            // 纵向照片
                            newWidth = photoSize * aspectRatio;
                            newHeight = photoSize;
                        }
                        // 更新照片几何体
                        const photoChild = group.children.find(c => c.geometry === geometry);
                        if (photoChild) {
                            photoChild.geometry.dispose();
                            photoChild.geometry = new THREE.PlaneGeometry(newWidth, newHeight);
                        }
                        // 更新边框几何体
                        const frameChild = group.children.find(c => c !== photoChild);
                        if (frameChild) {
                            frameChild.geometry.dispose();
                            frameChild.geometry = new THREE.PlaneGeometry(newWidth + 0.2, newHeight + 0.2);
                        }
                        // 保存比例信息
                        photoHeartPhotos[i].aspectRatio = aspectRatio;
                    }
                });

                // 边框层
                const frameMesh = new THREE.Mesh(frameGeo, frameMat.clone());
                frameMesh.position.z = -0.01;

                // 照片层
                const photoMesh = new THREE.Mesh(geometry, photoMat);

                group.add(frameMesh);
                group.add(photoMesh);

                const p = heartPoints[i];
                group.position.set(p.x, p.y, p.z);

                // 让照片正面朝向相机
                group.lookAt(camera.position);

                // 预计算飞入起始位置
                const angle = (i / 34) * Math.PI * 2;
                const r = 60 + Math.random() * 40;
                const flyInStartPos = new THREE.Vector3(
                    Math.cos(angle) * r,
                    Math.sin(angle) * r * 0.8,
                    -30 + Math.random() * 20
                );

                // 预设材质为透明模式
                group.children.forEach(child => {
                    if (child.material) {
                        child.material.transparent = true;
                    }
                });

                const data = {
                    mesh: group,
                    heartPos: p.clone(),
                    targetPos: p.clone(),
                    explodedPos: new THREE.Vector3(),
                    flyInStartPos: flyInStartPos,  // 预计算的飞入位置
                    rotationAxis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize(),
                    rotationSpeed: 0,
                    wobbleOffset: Math.random() * 100,
                    originalScale: 1.0  // 统一尺寸
                };

                group.scale.setScalar(data.originalScale);

                photoHeartPhotos.push(data);
                photoHeartGroup.add(group);
            }

            // 创建星尘粒子
            const particleGeo = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 500; i++) {
                vertices.push(
                    (Math.random() - 0.5) * 80,
                    (Math.random() - 0.5) * 80,
                    (Math.random() - 0.5) * 60
                );
            }
            particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

            const particleMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.3,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true
            });

            photoHeartParticles = new THREE.Points(particleGeo, particleMat);
            photoHeartGroup.add(photoHeartParticles);
        }

        // 显示照片心形（平滑过渡）
        function showPhotoHeart() {
            if (!photoHeartGroup) {
                preloadPhotoHeart();
            }

            // 开始淡入效果
            STATE.photoHeartOpacity = 0;
            photoHeartGroup.visible = true;
            particles.visible = false;
            STATE.photoHeartState = 'HEART';

            // 设置初始透明度为0
            photoHeartPhotos.forEach(p => {
                p.mesh.position.copy(p.heartPos);
                p.mesh.traverse(child => {
                    if (child.material) {
                        child.material.transparent = true;
                        child.material.opacity = 0;
                    }
                });
            });
            if (photoHeartParticles && photoHeartParticles.material) {
                photoHeartParticles.material.opacity = 0;
            }
        }

        // 隐藏照片心形
        function hidePhotoHeart() {
            if (photoHeartGroup) {
                photoHeartGroup.visible = false;
            }
            particles.visible = true;
        }

        // 开始 Stage 7→8 过渡动画
        function startTransition7to8() {
            STATE.transitioning7to8 = true;
            STATE.transitionProgress = 0;
            STATE.stage7HeartReleased = false;

            // 播放阶段切换音效
            AudioManager.playTransition();

            // 照片初始透明度已在预加载时设置好，只需设置位置和显示
            photoHeartPhotos.forEach(p => {
                p.mesh.position.copy(p.flyInStartPos);
                // 直接设置透明度为0
                p.mesh.children.forEach(child => {
                    if (child.material) child.material.opacity = 0;
                });
            });

            // 显示照片心形组
            if (photoHeartGroup) {
                photoHeartGroup.visible = true;
            }
        }

        // 更新 Stage 7→8 过渡动画
        function updateTransition7to8() {
            if (!STATE.transitioning7to8) return;

            // 过渡持续约1秒（60帧 @ 60fps）
            STATE.transitionProgress += 0.0167; // 约 1/60
            const t = Math.min(1, STATE.transitionProgress);
            const eased = easeInOutCubic(t);

            // 第一阶段 (0-0.4): 粒子淡出（简化计算，只改透明度不改位置）
            if (t < 0.4) {
                const particleFade = 1 - (t / 0.4);
                // 只更新尺寸实现淡出效果，避免大量位置计算
                const sizeValue = CONFIG.particleSize * particleFade;
                const activeCount = Math.min(CONFIG.particleCount - 10000, sizes.length);
                for (let i = 0; i < activeCount; i++) {
                    sizes[i] = sizeValue;
                }
                geometry.attributes.size.needsUpdate = true;
            }

            // 第二阶段 (0.2-1): 照片飞入组成心形
            if (t > 0.2) {
                const photoProgress = (t - 0.2) / 0.8;
                const photoEased = easeOutCubic(photoProgress);
                const opacity = Math.min(1, photoProgress * 1.8);

                photoHeartPhotos.forEach((p, i) => {
                    // 从飞入起点到心形位置的插值
                    p.mesh.position.lerpVectors(p.flyInStartPos, p.heartPos, photoEased);
                    p.mesh.lookAt(camera.position);

                    // 透明度渐入（直接访问children，避免traverse开销）
                    p.mesh.children.forEach(child => {
                        if (child.material) child.material.opacity = opacity;
                    });
                });

                // 星尘粒子也渐入
                if (photoHeartParticles && photoHeartParticles.material) {
                    photoHeartParticles.material.opacity = photoProgress * 0.6;
                }
            }

            // 过渡完成
            if (t >= 1) {
                STATE.transitioning7to8 = false;
                STATE.step = 8;
                STATE.photoHeartState = 'HEART';
                STATE.photoHeartOpacity = 1;
                particles.visible = false;

                // 确保所有照片在正确位置
                photoHeartPhotos.forEach(p => {
                    p.mesh.position.copy(p.heartPos);
                    p.mesh.children.forEach(child => {
                        if (child.material) child.material.opacity = 1;
                    });
                });
            }
        }

        // 照片心形爆炸 - 适中的扩散范围，便于看清照片
        function triggerPhotoExplosion() {
            if (STATE.photoHeartState === 'EXPLODED') return;
            STATE.photoHeartState = 'EXPLODED';

            // 播放扩散音效
            AudioManager.playScatter();

            photoHeartPhotos.forEach((p, index) => {
                // 适中的扩散范围，不要太远
                const r = 12 + Math.random() * 15; // 12-27的距离
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                p.explodedPos.set(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );

                // 随机旋转速度
                p.rotationSpeed = (Math.random() - 0.5) * 0.02;
            });
        }

        // 照片心形聚合
        function triggerPhotoGather() {
            if (STATE.photoHeartState === 'HEART') return;
            STATE.photoHeartState = 'HEART';

            // 播放聚合音效
            AudioManager.playGather();
        }

        // 照片心形动画更新
        function updatePhotoHeart() {
            if (!photoHeartGroup || !photoHeartGroup.visible) return;

            STATE.photoHeartTime += 0.01;
            const time = STATE.photoHeartTime;

            // 淡入效果（仅在非ZOOMED状态）
            if (STATE.photoHeartOpacity < 1 && STATE.photoHeartState !== 'ZOOMED') {
                STATE.photoHeartOpacity = Math.min(1, STATE.photoHeartOpacity + 0.02);
                const opacity = STATE.photoHeartOpacity;

                photoHeartPhotos.forEach(p => {
                    p.mesh.traverse(child => {
                        if (child.material) {
                            child.material.opacity = opacity;
                        }
                    });
                });
                if (photoHeartParticles && photoHeartParticles.material) {
                    photoHeartParticles.material.opacity = opacity * 0.6;
                }
            }

            // 柔和的心跳效果
            const beat = Math.pow(Math.sin(time * 2), 40) * 0.3 + 0.7;

            // 根据状态更新照片
            if (STATE.photoHeartState === 'ZOOMED') {
                // 放大状态：平滑过渡动画，禁用所有空间交互
                STATE.photoZoomProgress = Math.min(1, STATE.photoZoomProgress + 0.025);
                const t = easeOutCubic(STATE.photoZoomProgress);

                // 重置照片组旋转和相机位置（禁用空间交互）
                photoHeartGroup.rotation.x += (0 - photoHeartGroup.rotation.x) * 0.15;
                photoHeartGroup.rotation.y += (0 - photoHeartGroup.rotation.y) * 0.15;
                camera.position.z += (40 - camera.position.z) * 0.15;
                camera.position.x += (0 - camera.position.x) * 0.15;
                camera.position.y += (0 - camera.position.y) * 0.15;

                const zoomedIndex = STATE.zoomedPhotoIndex;
                const targetScale = 1.40;  // 放大比例
                // 照片放在屏幕正中央，z值越大越靠近相机（相机在z=40）
                const targetPos = new THREE.Vector3(0, 0, 35);

                photoHeartPhotos.forEach((p, i) => {
                    if (i === zoomedIndex) {
                        // 放大的照片：移动到中央并放大
                        const startPos = p.zoomStartPos || p.explodedPos;
                        const startScale = p.zoomStartScale || 1;

                        p.mesh.position.lerpVectors(startPos, targetPos, t);
                        const currentScale = startScale + (targetScale - startScale) * t;
                        p.mesh.scale.setScalar(currentScale);
                        // 让照片正对相机
                        p.mesh.rotation.set(0, 0, 0);

                        p.mesh.children.forEach(child => {
                            if (child.material) {
                                child.material.transparent = true;
                                child.material.opacity = 1;
                            }
                        });
                    } else {
                        // 其他照片：分配到左右两侧作为模糊背景
                        if (!p.sideTargetPos) {
                            // 根据索引交替分配左右（偶数左，奇数右）
                            const side = (i % 2 === 0) ? -1 : 1;
                            const xOffset = side * (12 + Math.random() * 6);
                            const yOffset = (Math.random() - 0.5) * 12;
                            // z值比放大照片小，让它们在后面作为背景
                            const zOffset = 15 + Math.random() * 10;
                            p.sideTargetPos = new THREE.Vector3(xOffset, yOffset, zOffset);
                        }

                        const startPos = p.zoomStartPos || p.explodedPos;
                        p.mesh.position.lerpVectors(startPos, p.sideTargetPos, t);
                        p.mesh.rotation.set(0, 0, 0);
                        // 缩小两侧照片
                        p.mesh.scale.setScalar(0.8);

                        const targetOpacity = 0.3;
                        p.mesh.children.forEach(child => {
                            if (child.material) {
                                child.material.transparent = true;
                                child.material.opacity = 1 - (1 - targetOpacity) * t;
                            }
                        });
                    }
                });
            } else if (STATE.photoHeartState === 'HEART') {
                // 心形状态：照片朝向相机，有心跳缩放
                photoHeartPhotos.forEach((p, i) => {
                    const scale = 1 + (beat - 0.7) * 0.15;
                    const target = p.heartPos.clone().multiplyScalar(scale);
                    p.mesh.position.lerp(target, 0.08);
                    p.mesh.scale.setScalar(p.originalScale);
                    p.mesh.lookAt(camera.position);
                });
            } else if (STATE.photoHeartState === 'EXPLODED') {
                // 爆炸状态：照片飘散 + 手掌三维控制
                // 平滑更新旋转角度
                STATE.photoGroupRotation.x += (STATE.handPosition3D.y * 0.5 - STATE.photoGroupRotation.x) * 0.05;
                STATE.photoGroupRotation.y += (STATE.handPosition3D.x * 0.8 - STATE.photoGroupRotation.y) * 0.05;

                // 应用旋转到整个照片组
                photoHeartGroup.rotation.x = STATE.photoGroupRotation.x;
                photoHeartGroup.rotation.y = STATE.photoGroupRotation.y;

                // 根据手掌z位置调整相机距离
                const targetZoom = 40 + STATE.handPosition3D.z * 15;
                camera.position.z += (targetZoom - camera.position.z) * 0.05;

                photoHeartPhotos.forEach((p, i) => {
                    p.mesh.position.lerp(p.explodedPos, 0.03);
                    p.mesh.position.y += Math.sin(time * 0.5 + p.wobbleOffset) * 0.015;
                    p.mesh.position.x += Math.cos(time * 0.3 + p.wobbleOffset) * 0.008;
                    p.mesh.rotateOnAxis(p.rotationAxis, p.rotationSpeed * 0.5);
                    p.mesh.scale.setScalar(p.originalScale);

                    // 恢复透明度
                    p.mesh.traverse(child => {
                        if (child.material && child.material.opacity < 1) {
                            child.material.opacity = Math.min(1, child.material.opacity + 0.05);
                        }
                    });
                });
            }
            // ZOOMED 状态：不执行任何空间交互，画面完全静止（由上面的 ZOOMED 分支处理）

            // 粒子缓慢旋转
            if (photoHeartParticles) {
                photoHeartParticles.rotation.y = time * 0.02;
            }
        }

        // 缓动函数
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // 检测张开手（用于Stage 8爆炸）
        function isPhotoHandOpen(lm) {
            let openFingers = 0;
            if (lm[8].y < lm[6].y) openFingers++;
            if (lm[12].y < lm[10].y) openFingers++;
            if (lm[16].y < lm[14].y) openFingers++;
            if (lm[20].y < lm[18].y) openFingers++;
            return openFingers >= 3;
        }

        // 检测握拳（用于Stage 8聚合）
        function isPhotoHandFist(lm) {
            let closedFingers = 0;
            if (lm[8].y > lm[6].y) closedFingers++;
            if (lm[12].y > lm[10].y) closedFingers++;
            if (lm[16].y > lm[14].y) closedFingers++;
            if (lm[20].y > lm[18].y) closedFingers++;
            return closedFingers >= 3;
        }

        // 检测捏合手势（食指+拇指捏合，其他三指张开）
        function isPinchGesture(lm) {
            // 计算食指尖和拇指尖的距离
            const thumbTip = lm[4];   // 拇指尖
            const indexTip = lm[8];   // 食指尖
            const pinchDist = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2)
            );

            // 计算手掌大小作为参考
            const palmSize = Math.sqrt(
                Math.pow(lm[0].x - lm[9].x, 2) +
                Math.pow(lm[0].y - lm[9].y, 2)
            );

            // 食指和拇指要靠近（距离小于手掌的30%）
            const isPinching = pinchDist < palmSize * 0.35;

            // 其他三指要张开（中指、无名指、小指）
            let openFingers = 0;
            if (lm[12].y < lm[10].y) openFingers++; // 中指
            if (lm[16].y < lm[14].y) openFingers++; // 无名指
            if (lm[20].y < lm[18].y) openFingers++; // 小指

            return isPinching && openFingers >= 2;
        }

        // 触发照片放大
        function triggerPhotoZoom() {
            if (STATE.photoHeartState === 'ZOOMED') return;
            if (STATE.photoHeartState !== 'EXPLODED') return;

            // 从未显示过的照片中随机选择一张
            let availableIndices = [];
            for (let i = 0; i < 34; i++) {
                if (!STATE.shownPhotoIndices.includes(i)) {
                    availableIndices.push(i);
                }
            }

            // 如果所有照片都显示过了，重置
            if (availableIndices.length === 0) {
                STATE.shownPhotoIndices = [];
                for (let i = 0; i < 34; i++) {
                    availableIndices.push(i);
                }
            }

            // 随机选择
            const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            STATE.zoomedPhotoIndex = randomIndex;
            STATE.shownPhotoIndices.push(randomIndex);
            STATE.photoZoomProgress = 0;
            STATE.photoHeartState = 'ZOOMED';

            // 记录每张照片的原始位置和缩放
            photoHeartPhotos.forEach((p, i) => {
                p.zoomStartPos = p.mesh.position.clone();
                p.zoomStartScale = p.mesh.scale.x;
            });

            // 播放快门音效
            AudioManager.playShutter();

            // 创建放大时的星星粒子
            createZoomSparkles();
        }

        // 创建放大时的星星/爱心粒子
        function createZoomSparkles() {
            // 清除旧粒子
            zoomSparkles.forEach(s => {
                if (s.mesh) photoHeartGroup.remove(s.mesh);
            });
            zoomSparkles = [];

            const targetPos = new THREE.Vector3(0, 0, 35);

            for (let i = 0; i < SPARKLE_CONFIG.count; i++) {
                // 随机选择形状：星星或爱心
                const isHeart = Math.random() > 0.5;
                let geometry;

                if (isHeart) {
                    // 简单的爱心形状（使用 Shape）
                    const heartShape = new THREE.Shape();
                    const s = SPARKLE_CONFIG.size * 0.5;
                    heartShape.moveTo(0, s * 0.3);
                    heartShape.bezierCurveTo(s * 0.5, s, s, s * 0.5, 0, -s * 0.5);
                    heartShape.bezierCurveTo(-s, s * 0.5, -s * 0.5, s, 0, s * 0.3);
                    geometry = new THREE.ShapeGeometry(heartShape);
                } else {
                    // 星星形状
                    geometry = new THREE.CircleGeometry(SPARKLE_CONFIG.size * 0.4, 5);
                }

                const color = SPARKLE_CONFIG.colors[Math.floor(Math.random() * SPARKLE_CONFIG.colors.length)];
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1,
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(geometry, material);

                // 初始位置在放大照片上方随机位置
                const startX = (Math.random() - 0.5) * 20;
                const startY = 15 + Math.random() * 10;
                const startZ = 30 + Math.random() * 10;
                mesh.position.set(startX, startY, startZ);

                // 随机旋转
                mesh.rotation.z = Math.random() * Math.PI * 2;

                photoHeartGroup.add(mesh);

                zoomSparkles.push({
                    mesh: mesh,
                    velocity: {
                        x: (Math.random() - 0.5) * 0.1,
                        y: -0.05 - Math.random() * 0.1,  // 向下飘落
                        z: (Math.random() - 0.5) * 0.05
                    },
                    rotationSpeed: (Math.random() - 0.5) * 0.1,
                    life: 1.0,
                    decay: 0.005 + Math.random() * 0.005
                });
            }
        }

        // 更新放大时的星星粒子
        function updateZoomSparkles() {
            if (STATE.photoHeartState !== 'ZOOMED') {
                // 不在放大状态时，淡出并移除粒子
                zoomSparkles.forEach(s => {
                    if (s.mesh) {
                        s.mesh.material.opacity *= 0.9;
                        if (s.mesh.material.opacity < 0.01) {
                            photoHeartGroup.remove(s.mesh);
                            s.mesh = null;
                        }
                    }
                });
                zoomSparkles = zoomSparkles.filter(s => s.mesh !== null);
                return;
            }

            // 更新每个粒子
            zoomSparkles.forEach(s => {
                if (!s.mesh) return;

                // 移动
                s.mesh.position.x += s.velocity.x;
                s.mesh.position.y += s.velocity.y;
                s.mesh.position.z += s.velocity.z;

                // 旋转
                s.mesh.rotation.z += s.rotationSpeed;

                // 生命周期
                s.life -= s.decay;
                s.mesh.material.opacity = Math.max(0, s.life);

                // 如果生命结束，重置到顶部
                if (s.life <= 0) {
                    s.life = 1.0;
                    s.mesh.position.x = (Math.random() - 0.5) * 20;
                    s.mesh.position.y = 15 + Math.random() * 5;
                    s.mesh.position.z = 30 + Math.random() * 10;
                    s.mesh.material.opacity = 1;
                }
            });
        }

        // 取消照片放大，恢复扩散状态
        function triggerPhotoUnzoom() {
            if (STATE.photoHeartState !== 'ZOOMED') return;
            STATE.photoHeartState = 'EXPLODED';
            STATE.zoomedPhotoIndex = -1;
            STATE.photoZoomProgress = 0;

            // 恢复所有照片的透明度，并清除侧面位置
            photoHeartPhotos.forEach(p => {
                p.sideTargetPos = null; // 清除侧面位置，下次捏合时重新计算
                p.mesh.traverse(child => {
                    if (child.material && child.material.opacity !== undefined) {
                        child.material.transparent = true;
                        child.material.opacity = 1;
                    }
                });
            });

            // 重置照片组旋转
            photoHeartGroup.rotation.x = 0;
            photoHeartGroup.rotation.y = 0;
            STATE.photoGroupRotation.x = 0;
            STATE.photoGroupRotation.y = 0;
        }

        init();
    </script>
